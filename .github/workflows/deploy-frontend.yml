# =============================================================
# Build frontend and deploy to Hostinger via FTP on push to main.
#
# Required GitHub repository secrets:
#   FTP_SERVER     -> Hostinger FTP host (örn. ftp.tunatest2.site veya files.000webhost.com)
#   FTP_USERNAME   -> Hostinger > Hosting > Files > FTP Accounts
#   FTP_PASSWORD   -> aynı yerden
#   FTP_REMOTE_DIR -> Genelde /public_html/  (eğer subdomain kullanıyorsanız: /public_html/ode)
# =============================================================

name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build (production)
        working-directory: frontend
        run: npm run build

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/node_modules/**
