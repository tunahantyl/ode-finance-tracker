# =============================================================
# Öde - Nginx server block for api.tunatest2.site
# Save as: /etc/nginx/sites-available/api.tunatest2.site
# Enable:  ln -s /etc/nginx/sites-available/api.tunatest2.site /etc/nginx/sites-enabled/
# Test:    nginx -t
# Reload:  systemctl reload nginx
# SSL:     certbot --nginx -d api.tunatest2.site
# =============================================================

# Rate-limit zone (10MB ~ 160k IP track, ortalama 10 req/s)
limit_req_zone $binary_remote_addr zone=ode_api:10m rate=10r/s;

# HTTP -> HTTPS redirect (Certbot bunu zaten ekleyebilir; sorun değil, idempotent)
server {
    listen 80;
    listen [::]:80;
    server_name api.tunatest2.site;

    # ACME challenge için
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.tunatest2.site;

    # === SSL ===
    # Certbot bu satırları otomatik dolduracak. İlk kurulum için "certbot --nginx ..." komutunu çalıştırın.
    # ssl_certificate     /etc/letsencrypt/live/api.tunatest2.site/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.tunatest2.site/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # === Logging (eski bot loglarınızı etkilemez, ayrı dosya) ===
    access_log /var/log/nginx/ode-api.access.log;
    error_log  /var/log/nginx/ode-api.error.log;

    # === Security headers ===
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # === Body size (ileride file upload için yer açıyoruz) ===
    client_max_body_size 2m;

    # === Reverse proxy to Node (PM2 :5000) ===
    location / {
        limit_req zone=ode_api burst=20 nodelay;

        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
    }
}
